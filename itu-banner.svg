    <tspan x="490" dy="18"><tspan fill="#f9e2af" font-weight="bold">Slicer       </tspan><tspan fill="#cdd6f4">: FlashPrint 5.x</tspan></tspan>
    <tspan x="490" dy="18"><tspan fill="#f9e2af" font-weight="bold">Hardware     </tspan><tspan fill="#cdd6f4">: EinScan SE-SP V2 3D Optical Scanner</tspan></tspan>
