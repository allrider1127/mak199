<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <style>
    .bg { fill: #0f1419; rx: 8px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .ascii { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; font-weight: bold; }
    .info { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; }
    .user { fill: #92f22a; font-weight: bold; } /* Mint Green */
    .host { fill: #38bdf8; font-weight: bold; } /* Sky Blue */
    .separator { fill: #475569; }
    .key { fill: #38bdf8; font-weight: bold; } /* Sky Blue */
    .val { fill: #e2e8f0; }
  </style>
  <rect width="100%" height="100%" class="bg"/>
  
  <!-- Window Controls -->
  <circle cx="20" cy="20" r="6" class="dot-red"/>
  <circle cx="40" cy="20" r="6" class="dot-yellow"/>
  <circle cx="60" cy="20" r="6" class="dot-green"/>
  
  <!-- Terminal Prompt Title -->
  <text x="90" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#64748b">fastfetch --mak199</text>
  
  <!-- Left Side: ITU ASCII Logo -->
