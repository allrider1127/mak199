    <tspan x="25" dy="14" fill="#003b73">   %%%%#    *%%%-   .%%%@#   .+%%@-   :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#    #@@%    .%%%@*    -@%@=   :@%%@*          *@%:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#    =+++    .%%%@*    :+++:   :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*            :@%%@*          *@@:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*            :@%%@*          *@%:</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*            .@%%@#          #%%.</tspan>
    <tspan x="25" dy="14" fill="#003b73">   %%%%#            .%%%@*             #@%%%-        -%@*</tspan>
    <tspan x="25" dy="14" fill="#003b73">. :%%%@%..       .. :%%%@#.  .          *%@@@*=::::=#@%+</tspan>
    <tspan x="25" dy="14" fill="#003b73">##########*     =#############:          :+*#%@@@%%%*=</tspan>
