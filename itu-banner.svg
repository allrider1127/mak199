  <!-- Right Side: Fastfetch Info -->
  <text x="470" y="65" class="info">
    <tspan class="user">karahanli</tspan><tspan fill="#e2e8f0">@</tspan><tspan class="host">itu.edu.tr</tspan>
    <tspan x="470" dy="12" class="separator">----------------------</tspan>
    <tspan x="470" dy="18"><tspan class="key">University   </tspan><tspan class="val">: Istanbul Technical University (İTÜ)</tspan></tspan>
    <tspan x="470" dy="16"><tspan class="key">Established  </tspan><tspan class="val">: 1773 (Muhendishane-i Bahr-i Humayun)</tspan></tspan>
    <tspan x="470" dy="16"><tspan class="key">Location     </tspan><tspan class="val">: Maslak, Istanbul, Turkey</tspan></tspan>
    <tspan x="470" dy="16"><tspan class="key">Department   </tspan><tspan class="val">: Mechanical Engineering</tspan></tspan>
    <tspan x="470" dy="16"><tspan class="key">Course       </tspan><tspan class="val">: MAK 199 - Intro to CAD &amp; Additive Mfg</tspan></tspan>
    <tspan x="470" dy="16"><tspan class="key">CRN          </tspan><tspan class="val">: 24595</tspan></tspan>
